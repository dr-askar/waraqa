name: Validate and publish Waraqa
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          WARAQA_GOOGLE_CLIENT_ID: ${{ vars.WARAQA_GOOGLE_CLIENT_ID }}
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:formats
      - run: npm run test:android-bridge
      - run: npm run test:share
      - run: npm run test:folders
      - run: npm run test:ui
      - run: npm run test:phase-one
      - run: npm run test:remaining-phases
      - run: npm run test:workspace
      - run: npm run test:browser
      - run: npm run test:repair
      - run: npm run test:signature
      - run: npm run test:advanced
      - run: npm run test:ocr
      - run: npm run test:directions
      - run: npm run test:auto-ocr
      - name: Package validated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Keep browser screenshots and generated PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            checks/*.png
            checks/*.pdf
            checks/*.docx
            checks/*.xlsx
            checks/*.pptx
            checks/*.csv
            checks/*.txt
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p android --console=plain assembleRelease assembleDebugAndroidTest lintRelease
      - name: Verify downloadable APK
        run: |
          cd dist/android
          sha256sum --check SHA256SUMS
          python ../../checks/apk-metadata.py
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs waraqa-android.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android share intents and WebView bridge
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p android --console=plain connectedDebugAndroidTest
      - name: Keep Android test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate, android]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
